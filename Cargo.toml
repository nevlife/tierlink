[workspace]
members = ["crates/ratectl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# pedantic, less the lints written for published library APIs. unwrap is for nothing: an invariant
# is stated in an expect message, and an exception to a lint carries its reason.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
allow_attributes_without_reason = "warn"
